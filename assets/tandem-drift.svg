<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Two cars tandem drifting around a track">
  <defs>
    <path id="track" d="M 150,45 L 360,45 C 430,45 450,100 520,100 L 600,100 C 670,100 690,45 760,45 L 840,45 A 55,55 0 0 1 840,155 L 150,155 A 55,55 0 0 1 150,45 Z"/>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#111111"/><rect x="4" y="4" width="4" height="4" fill="#111111"/>
      <rect x="4" width="4" height="4" fill="#ffffff"/><rect y="4" width="4" height="4" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- kerbs, asphalt, start line, centre line -->
  <use href="#track" xlink:href="#track" fill="none" stroke="#f2f2f2" stroke-width="32" stroke-linejoin="round"/>
  <use href="#track" xlink:href="#track" fill="none" stroke="#e10600" stroke-width="32" stroke-linejoin="round" stroke-dasharray="14 14"/>
  <use href="#track" xlink:href="#track" fill="none" stroke="#3a3a3a" stroke-width="24" stroke-linejoin="round"/>
  <rect x="496" y="143" width="8" height="24" fill="url(#checker)"/>
  <use href="#track" xlink:href="#track" fill="none" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="10 12"/>

  <!-- car A: red, leads -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;0;14;-12;0;0;-14;12;0;0;26;22;0;0;26;22;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="-0.75s" repeatCount="indefinite"/>
      <g fill="#d0d0d0">
        <circle cx="-24" cy="-5" r="4.5"><animate attributeName="opacity" values="0;0;0.6;0.5;0;0;0.6;0.5;0;0;0.85;0.7;0;0;0.85;0.7;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="-0.75s" repeatCount="indefinite"/></circle>
        <circle cx="-30" cy="3" r="6"><animate attributeName="opacity" values="0;0;0.45;0.4;0;0;0.45;0.4;0;0;0.7;0.55;0;0;0.7;0.55;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="-0.75s" repeatCount="indefinite"/></circle>
        <circle cx="-38" cy="-2" r="7.5"><animate attributeName="opacity" values="0;0;0.3;0.25;0;0;0.3;0.25;0;0;0.5;0.4;0;0;0.5;0.4;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="-0.75s" repeatCount="indefinite"/></circle>
      </g>
      <rect x="-14" y="-8" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="-14" y="5" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="8" y="-8" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="8" y="5" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="-18" y="-7" width="3" height="14" rx="1" fill="#111111"/>
      <rect x="15" y="-7" width="3" height="14" rx="1" fill="#111111"/>
      <rect x="-9" y="-5" width="11" height="10" rx="2" fill="#e10600"/>
      <rect x="-15" y="-2.5" width="31" height="5" rx="2.5" fill="#e10600"/>
      <rect x="-15" y="-0.6" width="31" height="1.2" fill="#ffffff"/>
      <circle cx="-1" cy="0" r="2" fill="#111111"/>
    </g>
    <animateMotion dur="9s" begin="-0.75s" repeatCount="indefinite" rotate="auto"><mpath href="#track" xlink:href="#track"/></animateMotion>
  </g>

  <!-- car B: white, chases in tandem -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;0;18;-15;0;0;-18;15;0;0;30;24;0;0;30;24;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      <g fill="#d0d0d0">
        <circle cx="-24" cy="-5" r="4.5"><animate attributeName="opacity" values="0;0;0.6;0.5;0;0;0.6;0.5;0;0;0.85;0.7;0;0;0.85;0.7;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="-30" cy="3" r="6"><animate attributeName="opacity" values="0;0;0.45;0.4;0;0;0.45;0.4;0;0;0.7;0.55;0;0;0.7;0.55;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="-38" cy="-2" r="7.5"><animate attributeName="opacity" values="0;0;0.3;0.25;0;0;0.3;0.25;0;0;0.5;0.4;0;0;0.5;0.4;0" keyTimes="0;0.12;0.15;0.20;0.22;0.265;0.29;0.34;0.365;0.41;0.44;0.49;0.51;0.90;0.93;0.98;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
      </g>
      <rect x="-14" y="-8" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="-14" y="5" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="8" y="-8" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="8" y="5" width="5" height="3" rx="1" fill="#111111"/>
      <rect x="-18" y="-7" width="3" height="14" rx="1" fill="#e10600"/>
      <rect x="15" y="-7" width="3" height="14" rx="1" fill="#e10600"/>
      <rect x="-9" y="-5" width="11" height="10" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="0.8"/>
      <rect x="-15" y="-2.5" width="31" height="5" rx="2.5" fill="#f4f4f4" stroke="#111111" stroke-width="0.8"/>
      <rect x="-15" y="-0.6" width="31" height="1.2" fill="#e10600"/>
      <circle cx="-1" cy="0" r="2" fill="#111111"/>
    </g>
    <animateMotion dur="9s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#track" xlink:href="#track"/></animateMotion>
  </g>
</svg>
